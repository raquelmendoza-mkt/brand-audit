<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carrusel · TÍTULO</title>
<link rel="stylesheet" href="../../marca.css">
<!--
  Copia esta plantilla a carruseles/proyectos/NN-tema/carrusel.html
  Brief
  Objetivo: (guardados / compartidos / comentarios con palabra clave / DM)
  Audiencia:
  Ángulo:
  Pilar 40/40/20: (valor / conexión / propiedades)
-->
</head>
<body data-handle="@raquelmendoza.mkt" data-name="Raquel Mendoza">
<main class="deck">

  <!-- 01 · GANCHO -->
  <section class="slide t-dark">
    <div class="content">
      <span class="kicker">Para realtors</span>
      <h1 class="hook">Gancho con una <em>palabra</em> clave</h1>
      <div class="rule"></div>
      <p class="body w-80">Promesa concreta de lo que van a encontrar al deslizar.</p>
    </div>
  </section>

  <!-- 02 · DESARROLLO (repetir: alterna t-light / t-dark) -->
  <section class="slide t-light">
    <div class="bignum">01</div>
    <div class="content">
      <span class="kicker">Paso 01</span>
      <h2 class="h1">Una idea por <em>slide</em></h2>
      <p class="body">Explicación breve. Resalta lo importante con <b>negrita</b>.</p>
    </div>
  </section>

  <!-- ÚLTIMO · CTA -->
  <section class="slide t-purple">
    <div class="content bottom">
      <span class="kicker">Siguiente paso</span>
      <h2 class="h1">Pregunta que <em>invita</em> a actuar</h2>
      <p class="body" style="color:#fff">Comenta <span class="keyword">PALABRA</span> y te envío…</p>
    </div>
  </section>

</main>
<script src="../../carrusel.js"></script>
</body>
</html>
